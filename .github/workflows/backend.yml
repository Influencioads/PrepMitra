name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: prepmitra
          POSTGRES_PASSWORD: prepmitra
          POSTGRES_DB: prepmitra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prepmitra" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Enable pgvector
        run: PGPASSWORD=prepmitra psql -h localhost -U prepmitra -d prepmitra_test -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Tests on PostgreSQL (schema from Alembic migrations)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://prepmitra:prepmitra@localhost:5432/prepmitra_test
        run: python -m pytest -q
