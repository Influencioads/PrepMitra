# Production stack for prepmitra.influencioweb.com. Runs from /opt/prepmitra on the shared server:
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
# Only the API is published, on 127.0.0.1:8110; nginx serves the web app and proxies /v1 to it.
name: prepmitra

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: prepmitra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_DB: prepmitra
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepmitra"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: ../backend
    image: prepmitra-api
    command: sh -c "alembic upgrade head && python -m app.seed"
    env_file: ../backend/.env
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://prepmitra:${POSTGRES_PASSWORD}@db:5432/prepmitra
      REDIS_URL: redis://redis:6379/0
      JOB_MODE: redis
      RUN_SCHEDULER_IN_API: "false"
    volumes: &backend_volumes
      - storage:/app/storage
      - ../backend/secrets:/app/secrets:ro
    depends_on:
      db: {condition: service_healthy}

  api:
    image: prepmitra-api
    env_file: ../backend/.env
    environment: *backend_env
    ports:
      - "127.0.0.1:8110:8000"
    volumes: *backend_volumes
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  worker:
    image: prepmitra-api
    command: python -m app.worker
    env_file: ../backend/.env
    environment: *backend_env
    volumes: *backend_volumes
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

volumes:
  pgdata:
  storage:
