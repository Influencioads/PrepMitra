# Local stack: `docker compose up -d db redis` for development, or the full stack with `docker compose up -d`.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: prepmitra
      POSTGRES_PASSWORD: prepmitra
      POSTGRES_DB: prepmitra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepmitra"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    command: sh -c "alembic upgrade head && python -m app.seed"
    env_file: backend/.env
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://prepmitra:prepmitra@db:5432/prepmitra
      REDIS_URL: redis://redis:6379/0
      JOB_MODE: redis
      RUN_SCHEDULER_IN_API: "false"
    depends_on:
      db: {condition: service_healthy}
    profiles: ["full"]

  api:
    build: ./backend
    env_file: backend/.env
    environment: *backend_env
    ports:
      - "8000:8000"
    volumes:
      - storage:/app/storage
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    profiles: ["full"]

  worker:
    build: ./backend
    command: python -m app.worker
    env_file: backend/.env
    environment: *backend_env
    volumes:
      - storage:/app/storage
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    profiles: ["full"]

volumes:
  pgdata:
  storage:
